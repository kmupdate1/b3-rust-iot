pump = { path = "../../driver/actuator/pump" }
mux = { path = "../../driver/mux" }
capability = { path = "../../capability" }
field-edge = { path = "../../device/field-edge" }
rp235x = { path = "../../implementation/rp235x" }
log = "0.4.33"

reqwless = {
    git = "https://github.com/drogue-iot/reqwless",
    rev = "68f703dfc16e6f7f964b7238c922c0d433118872",
    features = ["defmt"]
}
