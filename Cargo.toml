[workspace]
resolver = "3"
members = [
    #"capability",
    "function",
    #"point",
    "implementation/rp235x",
    #"implementation/stm32c0",
    "implementation/embassy-net",

    "driver/driver-core",
    #"driver/sensor/moisture",
    #"driver/sensor/photo-register",
    #"driver/sensor/thermistor",
    "driver/actuator/pump",
    #"driver/network/tcpip",
    #"driver/network/thread",
    #"driver/network/wifi",

    "device/field-edge",

    "examples/iot",
    #"examples/communication",
    #"examples/led",
    #"examples/wf",
]

[workspace.package]
edition = "2024"
authors = ["BlueBikeBase"]
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt"] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt", "icmp", "tcp", "udp", "raw", "dhcpv4", "medium-ethernet", "dns"] }
embassy-net-wiznet = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde" }
embassy-usb-logger = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde" }
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt", "firmware-logs"] }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "d945e092eb757955bc37a55c2c6e297df51bfcde", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
fixed = "1.23.1"
fixed-macro = "1.2"

serde = { version = "1.0.203", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

# for assign resources example
assign-resources = { git = "https://github.com/adamgreig/assign-resources", rev = "bd22cb7a92031fb16f74a5da42469d466c33383e" }

# for TB6612FNG example
tb6612fng = "1.0.0"

#cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
display-interface-spi = "0.5.0"
embedded-graphics = "0.8.1"
mipidsi = "0.8.0"
display-interface = "0.5.0"
byte-slice-cast = { version = "1.2.0", default-features = false }
smart-leds = "0.3.0"
heapless = "0.9"
usbd-hid = "0.10.0"

embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.1", features = ["async"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embedded-storage = { version = "0.3" }
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }
log = "0.4"
embedded-sdmmc = "0.7.0"

#b3-rust-stdlib = { git = "https://github.com/kmupdate1/b3-rust-stdlib.git", rev = "" }

[profile.release]
# Enable generation of debug symbols even on release builds
debug = true
